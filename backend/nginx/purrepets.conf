# PURRE PETS — Nginx (produkcja, jeden plik dla purrepets.pl + www).
#   /            → frontend SSR (TanStack Start na Nitro)  127.0.0.1:3000
#   /api/        → backend Express                          127.0.0.1:4000  (timeout 300s)
#   /socket.io/  → backend (realtime, WebSocket)
#   /uploads/    → dysk, fallback do API (Range/206)
#   /assets/     → statyki buildu (Nitro .output/public)
#
# UWAGA: to ma być JEDYNY aktywny plik vhost z server_name purrepets.pl.
# Ścieżki poniżej (certyfikaty, alias uploadów) to ZAŁOŻENIA — deploy.sh (DEPLOY_NGINX=1)
# weryfikuje je preflightem przed instalacją i przerywa, gdy nie pasują do serwera.
# Usuń (po zrobieniu backupu) duplikaty z /etc/nginx/sites-enabled/, np. purrepets.pl,
# które powielały server_name — powodowało to warning "conflicting server name".
# proxy_pass http://purre_api BEZ ukośnika na końcu NIE usuwa prefiksu /api/ — celowo.

# Anti brute-force na endpointach logowania/rejestracji.
limit_req_zone $binary_remote_addr zone=purre_auth:10m rate=10r/m;

upstream purre_front {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream purre_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name purrepets.pl www.purrepets.pl;
    return 301 https://purrepets.pl$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name purrepets.pl www.purrepets.pl;

    ssl_certificate /etc/letsencrypt/live/purrepets.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/purrepets.pl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Upload wideo do Reels.
    client_max_body_size 250m;
    client_body_timeout 120s;

    # Nagłówki bezpieczeństwa.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Statyki buildu (CSS/JS) — Nitro serwuje je z .output/public; tu tylko cache.
    location /assets/ {
        proxy_pass http://purre_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Vary "Accept-Encoding";
        gzip_static on;
    }

    # Rate limit: rejestracja / logowanie.
    location /api/auth/ {
        limit_req zone=purre_auth burst=20 nodelay;
        proxy_pass http://purre_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API — timeouty 300s (długie uploady wideo, LLM). Brak ukośnika w proxy_pass = prefiks /api/ zachowany.
    location /api/ {
        proxy_pass http://purre_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # WebSocket (Socket.IO) — realtime czat i powiadomienia.
    location /socket.io/ {
        proxy_pass http://purre_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Media z dysku + fallback do API (Range/206 dla wideo).
    location /uploads/ {
        alias /var/www/purrepets/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
        add_header Accept-Ranges bytes;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/webp webp;
            image/gif gif;
            image/avif avif;
            video/mp4 mp4;
            video/webm webm;
            video/quicktime mov;
            audio/mpeg mp3;
            audio/ogg ogg;
            audio/x-m4a m4a;
        }
        try_files $uri @uploads_api;
    }

    location @uploads_api {
        rewrite ^/uploads/(.*)$ /api/uploads/file/$1 break;
        proxy_pass http://purre_api;
        proxy_set_header Host $host;
    }

    # Frontend SSR.
    location / {
        proxy_pass http://purre_front;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
